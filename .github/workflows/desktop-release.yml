name: 🖥️ Desktop build & release (Tauri)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: 🏗️ Build desktop (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏷️ Set the version and the updater key
        shell: bash
        env:
          RELEASE_VERSION: 0.1.${{ github.run_number }}
          UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_PUBKEY" ] || [ -z "$SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing secrets TAURI_UPDATER_PUBKEY or TAURI_SIGNING_PRIVATE_KEY (see docs/11-deploiement.md)."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import re

          version = os.environ["RELEASE_VERSION"]
          os.chdir("src-tauri")

          with open("Cargo.toml", encoding="utf-8") as cargo_file:
              cargo_lines = cargo_file.read().splitlines(keepends=True)
          is_in_package_section = False
          for index, line in enumerate(cargo_lines):
              stripped_line = line.strip()
              if stripped_line.startswith("["):
                  is_in_package_section = stripped_line == "[package]"
              elif is_in_package_section and re.match(r"^version\s*=", line):
                  cargo_lines[index] = f'version = "{version}"\n'
          with open("Cargo.toml", "w", encoding="utf-8") as cargo_file:
              cargo_file.writelines(cargo_lines)

          with open("tauri.conf.json", encoding="utf-8") as config_file:
              tauri_config = json.load(config_file)
          tauri_config["version"] = version
          tauri_config["plugins"]["updater"]["pubkey"] = os.environ["UPDATER_PUBKEY"]
          with open("tauri.conf.json", "w", encoding="utf-8") as config_file:
              json.dump(tauri_config, config_file, indent=2, ensure_ascii=False)
              config_file.write("\n")

          print(f"Desktop version set to {version}")
          PY

      - name: 🔒 Sync Cargo.lock with the new version
        working-directory: web/src-tauri
        run: cargo update -p la-bonne-truffe-desktop

      - name: 🚀 Build and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUXT_PUBLIC_API_BASE: https://api.la-bonne-truffe.dibodev.fr
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: web
          tagName: v0.1.${{ github.run_number }}
          releaseName: "La Bonne Truffe Desktop v0.1.${{ github.run_number }}"
          releaseBody: |
            Installeur Windows (Tauri + Nuxt).

            **Version de l'app :** `0.1.${{ github.run_number }}` (le patch est le numéro de run GitHub Actions).

            Mise à jour dans l'app : au démarrage, elle lit `latest.json` sur la dernière release GitHub.
          releaseDraft: false
          prerelease: false
