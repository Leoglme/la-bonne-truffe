<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {

    const unknown = { coat: '#6B5A50', ear: '#4A3C34', muzzle: '#B59A86', tile: '#EAE2DA' };
    const blackTan = { coat: '#3A2F2A', ear: '#2B2420', muzzle: '#C98A4B', tile: '#E9E3F2' };
    const litters = [
      { name: "Du Clos de l'Ecotay", place: 'Baguer-Morvan, Ille-et-Vilaine', score: 85, look: gold, colorLabel: 'Gold', sexLine: '4 ♂ · 1 ♀', photo: '/_blob/3b7a194748aa1318196f29a0b20b4a3d' },

      { name: 'De la Ferme Kergaval', place: 'Bédée, Ille-et-Vilaine', score: 65, look: unknown, colorLabel: 'À confirmer', sexLine: '6 ♂ · 3 ♀' },

      { name: 'De Kerlann', place: 'Quimper, Finistère', score: 52, look: blackTan, colorLabel: 'Noir et feu', sexLine: '2 ♂ · 5 ♀' },
    ];
    const sortOptions = [
      { label: 'Meilleur score', description: 'Ce qui te correspond le plus, en premier', checked: true },
      { label: 'Les plus proches', description: "Depuis chez toi, à vol d'oiseau", checked: false },
      { label: 'Les moins chères', description: 'Prix inconnu en dernier', checked: false },
      { label: 'Départ le plus tôt', description: 'Le chiot que tu pourrais ramener en premier', checked: false },
      { label: 'Départ le plus tard', description: "Si tu n'es pas pressé", checked: false },
    ];
    return {
      cards: litters.map((litter) => ({
        name: litter.name,
        place: litter.place,
        score: String(litter.score),
        colorLabel: litter.colorLabel,
        sexLine: litter.sexLine,
        coat: litter.look.coat,
        ear: litter.look.ear,
        muzzle: litter.look.muzzle,
        photo: litter.photo || '',
        photoStyle: 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 20px; display: ' + (litter.photo ? 'block' : 'none') + ';',
        svgStyle: 'display: ' + (litter.photo ? 'none' : 'block') + ';',
        tileStyle: 'position: relative; display: flex; align-items: center; justify-content: center; height: 170px; box-sizing: border-box; border-radius: 20px; background: ' + litter.look.tile + ';' + (litter.expected ? ' border: 3px dashed rgba(201,74,40,0.35);' : ''),
      })),
      sorts: sortOptions.map((option) => ({
        label: option.label,
        description: option.description,
        checked: option.checked ? 'true' : 'false',
        rowStyle: 'display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 58px; padding: 8px 14px; box-sizing: border-box; border: none; border-radius: 14px; text-align: left; color: #2B2420; background: ' + (option.checked ? '#FBF6EE' : 'transparent') + ';',
        labelStyle: 'font-size: 15px; font-weight: ' + (option.checked ? '800' : '700') + ';',
        checkStyle: 'flex-shrink: 0; display: ' + (option.checked ? 'block' : 'none') + ';',
      })),
    };
  }
}
