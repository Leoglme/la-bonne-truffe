server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name la-bonne-truffe.dibodev.fr;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  location ^~ /_nuxt/ {
    root /var/www/la-bonne-truffe.dibodev.fr/html;
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:5630;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    add_header Cache-Control "no-store, no-cache";
  }

  ssl_certificate /etc/letsencrypt/live/la-bonne-truffe.dibodev.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/la-bonne-truffe.dibodev.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Une seule origine pour la PWA (service worker, abonnements Web Push) et pour le CORS de l'API.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.la-bonne-truffe.dibodev.fr;

  ssl_certificate /etc/letsencrypt/live/la-bonne-truffe.dibodev.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/la-bonne-truffe.dibodev.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://la-bonne-truffe.dibodev.fr$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name la-bonne-truffe.dibodev.fr www.la-bonne-truffe.dibodev.fr;
  return 301 https://la-bonne-truffe.dibodev.fr$request_uri;
}
