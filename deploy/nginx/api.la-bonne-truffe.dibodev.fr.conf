server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.la-bonne-truffe.dibodev.fr www.api.la-bonne-truffe.dibodev.fr;
  # Un PC relaie environ 1 Mo de pages de la Centrale Canine à chaque relevé.
  client_max_body_size 10M;

  gzip on;
  gzip_types application/json;

  location / {
    proxy_pass http://127.0.0.1:8030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Un relevé lancé à la main ne répond qu'à sa fin, à une page par seconde.
    proxy_read_timeout 300s;
  }

  ssl_certificate /etc/letsencrypt/live/api.la-bonne-truffe.dibodev.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.la-bonne-truffe.dibodev.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.la-bonne-truffe.dibodev.fr www.api.la-bonne-truffe.dibodev.fr;
  return 301 https://$host$request_uri;
}
