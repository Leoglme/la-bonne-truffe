[tool.ruff]
# py311 = le Python minimal du projet (voir docs/05-architecture.md).
target-version = "py311"
line-length = 120
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W",    # pycodestyle warnings
  "F",    # pyflakes — imports et variables morts
  "I",    # isort — ordre des imports
  "UP",   # pyupgrade — syntaxe périmée
  "B",    # flake8-bugbear — pièges réels
  "C4",   # comprehensions inutilement verbeuses
  "SIM",  # simplifications lisibles
  "RUF",  # règles propres à ruff
]
ignore = [
  "E501",    # la longueur de ligne est portée par le formateur
  "B008",    # `Depends()` en valeur par défaut est le pattern FastAPI
  "RUF001",  # les chaînes FR contiennent des caractères typographiques (« », —)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"models/__init__.py" = ["F401"]   # baril de ré-exports : les imports SONT l'API du package

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
# These libraries ship no type information.
module = ["pywebpush", "py_vapid", "apscheduler.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
